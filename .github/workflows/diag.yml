name: Diag
on:
  push:
    branches: [final-fix-ci]
jobs:
  d:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: python.org python
        run: |
          curl -fsSL -o p.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg p.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m venv v
      - name: look
        run: |
          F=/Library/Frameworks/Python.framework/Versions/3.12
          ls $F/lib | head -30
          for f in $F/lib/libcrypto*.dylib ; do echo $f; otool -l $f | grep -A4 "LC_BUILD_VERSION\|LC_VERSION_MIN" | grep "minos\|version"; done
          ls /usr/local/opt/openssl@3/lib 2>/dev/null | head
          otool -l /usr/local/opt/openssl@3/lib/libcrypto.3.dylib | grep minos || true
          . v/bin/activate
          grep -v '^psycopg' requirements.txt > r.txt
          pip install -q -r r.txt
          pip list 2>/dev/null | grep -i "crypt\|jwt\|zip"
          S=$(python -c "import cryptography,os;print(os.path.dirname(cryptography.__file__))")
          otool -L $S/hazmat/bindings/_rust.abi3.so
          python -c "import _ssl;print(_ssl.__file__)"; otool -L $(python -c "import _ssl;print(_ssl.__file__)")
          otool -l $(python -c "import _ssl;print(_ssl.__file__)") | grep -A2 LC_RPATH
