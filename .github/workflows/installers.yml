# Builds the per-system installers and proves each one installs and runs.
name: Installers

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "app/paths.py"
      - "app/__main__.py"
      - "app/tray.py"
      - "app/menubar.py"
      - "requirements-menubar.txt"
      - ".github/workflows/installers.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "app/paths.py"
      - ".github/workflows/installers.yml"
  workflow_dispatch:
  # Release calls this on a version tag.
  workflow_call:
    secrets:
      MACOS_DEVID_P12:
        required: false
      MACOS_DEVID_P12_PASSWORD:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER:
        required: false
      ASC_KEY_P8:
        required: false

permissions:
  contents: read

env:
  WINSW_VERSION: v2.12.0
  WINSW_SHA256: 05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: pip install -r requirements.txt -r requirements-tray.txt "pyinstaller==6.*"

      # The comskip host is slow from some runners; keep what was fetched once.
      - name: Cache the fetched programs
        id: tools
        uses: actions/cache@v5
        with:
          path: packaging/tools/windows-x64
          key: tools-windows-x64-${{ hashFiles('packaging/tools.json', 'packaging/fetch_tools.py') }}

      - name: Fetch ffmpeg and comskip
        if: steps.tools.outputs.cache-hit != 'true'
        run: python packaging/fetch_tools.py windows x64 packaging/tools/windows-x64

      - name: Freeze the server
        env:
          COUCHELEPHANT_TOOLS: ${{ github.workspace }}\packaging\tools\windows-x64
        run: pyinstaller --noconfirm packaging/couchelephant.spec

      - name: Smoke test the frozen server
        run: python packaging/smoke.py dist/couchelephant/couchelephant.exe

      - name: Freeze the tray
        run: pyinstaller --noconfirm packaging/windows/tray.spec

      - name: Fetch the service program (pinned, checked)
        shell: pwsh
        run: |
          $url = "https://github.com/winsw/winsw/releases/download/$env:WINSW_VERSION/WinSW-x64.exe"
          Invoke-WebRequest $url -OutFile packaging/windows/WinSW-x64.exe
          $got = (Get-FileHash packaging/windows/WinSW-x64.exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:WINSW_SHA256) { throw "WinSW hash mismatch: $got" }

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path app/version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows\couchelephant.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Test the installer
        shell: pwsh
        run: packaging/windows/test_install.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: CouchElephant-Setup
          path: dist/CouchElephant-Setup-*.exe

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ffmpeg and the comskip build are slow to fetch and compile; keep them.
      - name: Cache the programs
        id: tools
        uses: actions/cache@v5
        with:
          path: packaging/tools/linux-${{ matrix.arch }}
          key: tools-linux-${{ matrix.arch }}-${{ hashFiles('packaging/tools.json', 'packaging/build_comskip.sh', 'packaging/linux/build_in_rocky.sh', 'packaging/fetch_tools.py') }}

      - name: Fetch ffmpeg
        if: steps.tools.outputs.cache-hit != 'true'
        run: python packaging/fetch_tools.py linux ${{ matrix.arch }} packaging/tools/linux-${{ matrix.arch }}

      # Rocky 9 carries the oldest glibc of the systems we install on, so the
      # frozen server and comskip run on all of them. The script also builds
      # comskip, freezes the server and smoke tests it.
      - name: Build comskip, freeze and smoke test in Rocky Linux 9
        run: |
          docker run --rm -v "$PWD:/src" -w /src rockylinux:9 \
            packaging/linux/build_in_rocky.sh ${{ matrix.arch }} packaging/tools/linux-${{ matrix.arch }} "$(id -u):$(id -g)"

      - name: Build the packages
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/version.py)
          packaging/linux/build_packages.sh "$version" ${{ matrix.deb_arch }} dist/couchelephant dist/linux
          # Two throwaway versions let the install test try an upgrade.
          for v in 9.9.8 9.9.9; do
            packaging/linux/build_packages.sh "$v" ${{ matrix.deb_arch }} dist/couchelephant dist/linux-test
          done

      - name: Test the packages on Debian, Ubuntu, Fedora and Rocky
        run: packaging/linux/test_install.sh dist/linux-test 9.9.8 9.9.9 ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v5
        with:
          name: CouchElephant-linux-${{ matrix.arch }}
          path: dist/linux/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      # Signing steps run only when the Developer ID secrets exist.
      HAVE_SIGNING: ${{ secrets.MACOS_DEVID_P12 != '' && secrets.MACOS_DEVID_P12_PASSWORD != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: pip install -r requirements.txt -r requirements-menubar.txt "pyinstaller==6.*"

      - name: Fetch ffmpeg
        run: python packaging/fetch_tools.py macos ${{ matrix.arch }} packaging/tools/macos-${{ matrix.arch }}

      - name: Build comskip
        run: |
          # ffmpeg 7 and argtable are built here for macOS 13 and linked in,
          # so comskip needs no Homebrew and nothing newer than macOS 13.
          brew install autoconf automake libtool pkg-config nasm
          packaging/macos/build_comskip_static.sh packaging/tools/macos-${{ matrix.arch }}

      - name: Freeze the server
        env:
          COUCHELEPHANT_TOOLS: ${{ github.workspace }}/packaging/tools/macos-${{ matrix.arch }}
        run: pyinstaller --noconfirm packaging/couchelephant.spec

      - name: Smoke test the frozen server
        run: python packaging/smoke.py dist/couchelephant/couchelephant

      - name: Freeze the app
        env:
          COUCHELEPHANT_TOOLS: ${{ github.workspace }}/packaging/tools/macos-${{ matrix.arch }}
        run: |
          rm -rf dist/CouchElephant
          pyinstaller --noconfirm packaging/macos/menubar.spec

      - name: Import the Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          P12: ${{ secrets.MACOS_DEVID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/build.keychain-db"
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          id="$(security find-identity -v -p codesigning "$kc" | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/' || true)"
          if [ -z "$id" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"

      - name: Sign and notarize the app
        if: env.HAVE_SIGNING == 'true'
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
        run: |
          [ -n "${SIGN_IDENTITY:-}" ] || { echo "::error::SIGN_IDENTITY is empty"; exit 1; }
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          packaging/macos/sign_and_notarize.sh "$SIGN_IDENTITY" "$RUNNER_TEMP/asc.p8" "$ASC_KEY_ID" "$ASC_ISSUER"

      - name: Build the dmg
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/version.py)
          packaging/macos/make_dmg.sh "$version" ${{ matrix.arch }}

      - name: Sign the dmg
        if: env.HAVE_SIGNING == 'true'
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [ -n "${SIGN_IDENTITY:-}" ] || { echo "::error::SIGN_IDENTITY is empty"; exit 1; }
          codesign --force --timestamp --sign "$SIGN_IDENTITY" dist/CouchElephant-*.dmg

      - name: Say so when the build is unsigned
        if: env.HAVE_SIGNING != 'true'
        run: echo "::warning::Unsigned build, the Developer ID secrets are not set."

      - name: Test the dmg
        env:
          REQUIRE_SIGNED: ${{ env.HAVE_SIGNING == 'true' && '1' || '0' }}
        run: packaging/macos/test_app.sh dist/CouchElephant-*-macos-${{ matrix.arch }}.dmg

      - name: Remove the temporary keychain and key files
        if: always()
        run: |
          [ -z "${SIGN_KEYCHAIN:-}" ] || security delete-keychain "$SIGN_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/asc.p8"

      - uses: actions/upload-artifact@v5
        with:
          name: CouchElephant-macos-${{ matrix.arch }}
          path: dist/CouchElephant-*.dmg
