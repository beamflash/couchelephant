# Build the image and publish it to GitHub Container Registry.
#
# Tag a release and this runs:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# It publishes linux/amd64 and linux/arm64, so the same tag works on a normal
# server and on a Raspberry Pi. The suite has to pass first: an image that
# fails its own tests must never reach anyone's Unraid box.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Throwaway tag for a DRAFT release, to prove the pipeline (for example v0.0.0-test-1)"
        required: false

env:
  # Both registries carry the same image. Docker Hub is where people look
  # first; ghcr.io has no pull limit and needs no second account, so a
  # `docker pull` from a stranger's Unraid box never hits a rate limit.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  installers:
    needs: test
    uses: ./.github/workflows/installers.yml
    secrets: inherit

  # Gathers every installer, checksums them and attaches them to the release.
  # A manual run only ever makes a draft, and only when given a tag.
  release-assets:
    needs: installers
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      DRAFT: ${{ github.event_name == 'push' && '' || '--draft' }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: CouchElephant-*
          path: assets
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* $DRAFT --target "$GITHUB_SHA" --title "$TAG" \
              --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skipped until DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist, so the
      # workflow works before Docker Hub is set up and picks it up after.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          # v1.2.3 becomes 1.2.3, 1.2 and 1, plus latest. Somebody pinning
          # :1 gets fixes without a surprise major version.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # A manual run publishes :edge and nothing else, so the whole
            # pipeline can be proved without spending a version number.
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
        env:
          # Multi-arch: registries read the annotations off the index, not
          # only off each manifest, so both levels have to carry them.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
