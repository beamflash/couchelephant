# The public CouchElephant demo for the App Store reviewer, behind Caddy.
# docs/demo.md says how to put it on a fresh server.
#
#   cp .env.example .env      # then set DEMO_CODE
#   docker compose up -d --build
#
# Caddy gets and renews the Let's Encrypt certificate for the demo's name by
# itself. The demo container publishes no port: only Caddy can reach it.
services:
  demo:
    build:
      context: ../..
      dockerfile: Dockerfile.demo
    image: couchelephant-demo:latest
    container_name: couchelephant-demo
    restart: unless-stopped
    environment:
      # The review code, from .env. The server will not start without it.
      DEMO_CODE: ${DEMO_CODE:?set DEMO_CODE in .env}
      # The container's clock: the nightly reset is at DEMO_RESET_HOUR on it.
      TZ: ${TZ:-America/Los_Angeles}
      DEMO_TIMEZONE: ${TZ:-America/Los_Angeles}
      DEMO_RESET_HOUR: "4"
      # Caddy has the one fixed address below, and is the only proxy believed
      # (not the gateway, which is where an IPv6 visitor's connection comes from).
      DEMO_TRUSTED_PROXIES: 172.29.0.2/32
      # Two streams at once, live and recording together.
      DEMO_TUNERS: "2"
    volumes:
      - demo-data:/data
    networks:
      demo:
        # Fixed, and outside the range Docker hands out by itself, so neither
        # container can be given the other's address by starting first.
        ipv4_address: 172.29.0.3
    # A runaway ffmpeg cannot use all the memory. (No cpus cap: it is refused
    # on a one-core server.)
    mem_limit: 1280m
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.8.4
    container_name: couchelephant-caddy
    restart: unless-stopped
    depends_on:
      - demo
    environment:
      DEMO_HOST: ${DEMO_HOST:-demo.couchelephant.app}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      demo:
        ipv4_address: 172.29.0.2

networks:
  demo:
    ipam:
      config:
        - subnet: 172.29.0.0/24
          # Addresses given out automatically come from here; 172.29.0.2 (Caddy)
          # and 172.29.0.3 (the demo) are named, so they are never taken first.
          ip_range: 172.29.0.128/25

volumes:
  demo-data:
  caddy-data:
  caddy-config:
