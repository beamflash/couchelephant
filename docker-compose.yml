# The same container the README describes, as a compose file.
#
#   docker compose up -d
#
# Then open http://<this-host>:8710 and put your Plex address and token into
# Settings, Plex. Nothing else is required.
services:
  couchelephant:
    image: ghcr.io/beamflash/couchelephant:latest
    container_name: couchelephant
    restart: unless-stopped
    # The apps find the server by itself only with host networking. Remove
    # "ports" and uncomment the next line to allow it.
    # network_mode: host
    ports:
      - "8710:8710"
    volumes:
      # The database, your channel artwork, and any snapshots you schedule.
      - ./data:/data
    environment:
      # The container's clock. Guide times are stored as UTC and shown in the
      # timezone you pick in Settings, so this only affects the log.
      - TZ=UTC
      # Run as the user Plex runs as, so CouchElephant can write the folders
      # Plex makes in your library. On Unraid that is usually 99 and 100.
      # Leave both out to run as root, as before.
      # - PUID=99
      # - PGID=100
