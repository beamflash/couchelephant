[pytest]
testpaths = tests
addopts = -q --strict-markers
# The backup tests write archives into tmp_path. Keeping three runs of those
# fills a container tmpfs for no benefit.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
markers =
    live: talks to the real Firestore, needs COUCHELEPHANT_REPORT_LIVE=1
filterwarnings =
    ignore::DeprecationWarning
